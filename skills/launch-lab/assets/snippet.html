<!doctype html>
<!-- Library demo page for Launch Lab. record_web.mjs injects window.__SNIPPET__:
     {"title": "example.py", "lang": "python", "code": "...", "output": "...", "typing_ms": 28}
     The page types the code, shows the real output, then sets window.__DONE__ = true. -->
<html>
<head>
<meta charset="utf-8">
<title>snippet</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#7d8590;
          --kw:#ff7b72; --str:#a5d6ff; --num:#79c0ff; --com:#8b949e; --fn:#d2a8ff; --ok:#3fb950; }
  html, body { margin:0; height:100%; background:var(--bg); }
  body { display:flex; align-items:center; justify-content:center; font:16px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--fg); }
  .wrap { width:min(1120px, 92vw); display:grid; gap:18px; }
  .win { background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); color:var(--dim); font-size:13px; }
  .dot { width:12px; height:12px; border-radius:50%; } .r{background:#ff5f57} .y{background:#febc2e} .g{background:#28c840}
  .bar span { margin-left:8px; }
  pre { margin:0; padding:18px 22px; white-space:pre-wrap; min-height:1.55em; }
  .out pre { color:var(--fg); }
  .out { opacity:0; transform:translateY(6px); transition:opacity .35s, transform .35s; }
  .out.show { opacity:1; transform:none; }
  .caret { display:inline-block; width:.6ch; background:var(--fg); animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .kw{color:var(--kw)} .str{color:var(--str)} .num{color:var(--num)} .com{color:var(--com)} .fn{color:var(--fn)}
</style>
</head>
<body>
<div class="wrap">
  <div class="win"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><span id="title">example</span></div><pre id="code"></pre></div>
  <div class="win out" id="out"><div class="bar"><span>output</span></div><pre id="output"></pre></div>
</div>
<script>
const S = window.__SNIPPET__ || { title: "example.py", lang: "python", code: "print('hello')", output: "hello" };
const KW = /\b(import|from|as|def|return|if|else|elif|for|in|while|class|with|await|async|const|let|var|function|new|export|use|fn|pub|let|mut|package|func|go|try|except|catch|throw|yield|lambda|None|True|False|null|true|false|undefined)\b/g;
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function highlight(src) {
  const parts = [];
  const re = /(#[^\n]*|\/\/[^\n]*)|("(?:\\.|[^"\\])*"?|'(?:\\.|[^'\\])*'?|`[^`]*`?)|(\b\d+(?:\.\d+)?\b)|(\b[A-Za-z_]\w*(?=\())/g;
  let last = 0, m;
  while ((m = re.exec(src))) {
    parts.push(esc(src.slice(last, m.index)).replace(KW, '<span class="kw">$1</span>'));
    const cls = m[1] ? "com" : m[2] ? "str" : m[3] ? "num" : "fn";
    parts.push(`<span class="${cls}">${esc(m[0])}</span>`);
    last = re.lastIndex;
  }
  parts.push(esc(src.slice(last)).replace(KW, '<span class="kw">$1</span>'));
  return parts.join("");
}
document.getElementById("title").textContent = S.title || "example";
const code = document.getElementById("code");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
(async () => {
  await sleep(500);
  const src = S.code || "";
  for (let i = 1; i <= src.length; i++) {
    code.innerHTML = highlight(src.slice(0, i)) + '<span class="caret">&nbsp;</span>';
    await sleep(src[i - 1] === "\n" ? (S.typing_ms || 28) * 4 : (S.typing_ms || 28));
  }
  code.innerHTML = highlight(src);
  await sleep(500);
  document.getElementById("output").textContent = S.output || "";
  document.getElementById("out").classList.add("show");
  await sleep(S.hold_ms || 2500);
  window.__DONE__ = true;
})();
</script>
</body>
</html>
